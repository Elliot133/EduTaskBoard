<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Subjects – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<!-- Hamburger button - 3 lines -->
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay - darkens screen when sidebar opens -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-admin}" th:with="activePage='subjects'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Subjects</h1><p class="page-sub">Create subjects taught across the school</p></div>
      <a th:href="@{/admin/assignments}" class="btn btn-outline">Teacher Assignments →</a>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert a-error">⚠ <span th:text="${error}"></span></div>

    <div class="two-col">
      <div class="card">
        <div class="card-header"><h2 class="card-title">Add New Subject</h2></div>
        <div class="fw">
          <form action="/admin/subjects/save" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="fg"><label class="fl">Subject Name *</label><input type="text" name="name" class="fi" placeholder="e.g. Mathematics" required/></div>
            <div class="fg"><label class="fl">Code</label><input type="text" name="code" class="fi" placeholder="e.g. MTH"/></div>
            <div class="fg"><label class="fl">Description</label><input type="text" name="description" class="fi" placeholder="Optional"/></div>
            <button type="submit" class="btn btn-primary btn-full">Create Subject</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">All Subjects</h2>
          <span class="badge b-count" th:text="${#lists.size(subjects)}">0</span>
        </div>
        <div class="cls-list">
          <div th:each="s : ${subjects}" class="cls-item">
            <div>
              <div class="cls-name" th:text="${s.name}">Subject</div>
              <div class="cls-meta">
                <span th:text="${s.code ?: 'No code'}">Code</span> ·
                <span th:text="${s.description ?: 'No description'}">Desc</span>
              </div>
            </div>
            <form th:action="@{/admin/subjects/{id}/delete(id=${s.id})}" method="post" onsubmit="return confirm('Delete subject?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
          </div>
          <div th:if="${#lists.isEmpty(subjects)}" class="empty-st">No subjects yet.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // Mobile sidebar toggle
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
