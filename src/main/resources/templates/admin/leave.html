<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Leave Requests – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<!-- Hamburger button - 3 lines -->
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay - darkens screen when sidebar opens -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-admin}" th:with="activePage='timetable'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Teacher Leave Requests</h1><p class="page-sub">Review and approve/reject leave applications</p></div>
      <a th:href="@{/admin/timetable}" class="btn btn-outline">← Timetable</a>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>

    <div class="card">
      <div class="tw">
        <table class="dt">
          <thead><tr><th>Teacher</th><th>Dates</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="r : ${requests}">
              <td th:text="${r.teacher.fullName}">Teacher</td>
              <td th:text="${r.startDate} + ' → ' + ${r.endDate}">Dates</td>
              <td th:text="${r.reason}">Reason</td>
              <td>
                <span th:if="${r.status.name() == 'PENDING'}" class="badge b-pending">Pending</span>
                <span th:if="${r.status.name() == 'APPROVED'}" class="badge b-active">Approved</span>
                <span th:if="${r.status.name() == 'REJECTED'}" class="badge b-late">Rejected</span>
              </td>
              <td th:if="${r.status.name() == 'PENDING'}" style="display:flex;gap:.4rem">
                <form th:action="@{/admin/leave/{id}/review(id=${r.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="approve" value="true"/>
                  <button type="submit" class="btn btn-sm btn-primary">Approve</button>
                </form>
                <form th:action="@{/admin/leave/{id}/review(id=${r.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="approve" value="false"/>
                  <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                </form>
              </td>
              <td th:unless="${r.status.name() == 'PENDING'}" class="muted">Reviewed</td>
            </tr>
            <tr th:if="${#lists.isEmpty(requests)}"><td colspan="5" class="erow">No leave requests yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  // Mobile sidebar toggle
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
