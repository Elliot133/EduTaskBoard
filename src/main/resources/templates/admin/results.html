<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Report Cards – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<!-- Hamburger button - 3 lines -->
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay - darkens screen when sidebar opens -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-admin}" th:with="activePage='results'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Report Cards</h1><p class="page-sub">School-wide results, principal remarks, and printable PDFs</p></div>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>

    <div class="card" style="padding:1rem 1.4rem;margin-bottom:1.2rem">
      <form method="get" action="/admin/results">
        <label class="fl">Class</label>
        <select name="classId" class="fi" style="max-width:260px" onchange="this.form.submit()">
          <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"
                  th:selected="${selectedClass != null and selectedClass.id == c.id}">Class</option>
        </select>
      </form>
    </div>

    <div th:each="rc : ${reportCards}" class="card mb-6" style="padding:1.2rem 1.4rem">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem">
        <div>
          <div style="font-weight:700" th:text="${rc.student.fullName}">Student</div>
          <div class="muted" style="font-size:.8rem">
            Total: <b th:text="${rc.overallTotal}">0</b> · Average: <b th:text="${rc.overallAverage}">0</b> ·
            Grade: <b th:class="'grade-' + ${rc.overallGrade}" th:text="${rc.overallGrade}">A</b> ·
            Position #<b th:text="${rc.overallPosition}">1</b>
          </div>
        </div>
        <a th:href="@{/admin/results/{id}/pdf(id=${rc.id})}" class="btn btn-sm btn-outline">Download PDF</a>
      </div>
      <form action="/admin/results/principal-remark" method="post" style="margin-top:.8rem;display:flex;gap:.5rem">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="reportCardId" th:value="${rc.id}"/>
        <input type="text" name="remark" class="fi" th:value="${rc.principalRemark}" placeholder="Principal's remark (optional)…" style="flex:1"/>
        <button type="submit" class="btn btn-sm btn-primary">Save</button>
      </form>
    </div>
    <div class="card" th:if="${#lists.isEmpty(reportCards)}"><div class="empty-st">No report cards generated for this class yet.</div></div>
  </main>
</div>

<script>
  // Mobile sidebar toggle
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
