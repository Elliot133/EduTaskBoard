<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Users – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <style>
    /* User page SVG sizing */
    .card-header .nav-icon {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .btn .nav-icon {
      width: 0.9rem;
      height: 0.9rem;
      fill: currentColor;
      margin-right: 0.25rem;
      vertical-align: middle;
    }
    .alert .nav-icon {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
  </style>
</head>
<body class="app-body">
<!-- Hamburger button - 3 lines -->
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay - darkens screen when sidebar opens -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-admin}" th:with="activePage='users'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">User Management</h1><p class="page-sub">Manage all accounts</p></div>
      <a th:href="@{/admin/users/new}" class="btn btn-primary">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add User
      </a>
    </div>

    <div th:if="${success}" class="alert a-success">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert a-error">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span th:text="${error}"></span>
    </div>

    <!-- Pending Registrations -->
    <div th:if="${not #lists.isEmpty(pending)}" class="card mb-6">
      <div class="card-header">
        <h2 class="card-title">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          Pending Approvals
        </h2>
        <span class="badge b-pending" th:text="${#lists.size(pending)}">0</span>
      </div>
      <div class="tw">
        <table class="dt">
          <thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="u : ${pending}">
              <td th:text="${u.fullName}">Name</td>
              <td><code th:text="${u.username}">user</code></td>
              <td th:text="${u.email}">email</td>
              <td><span th:class="${'badge b-' + u.role.name().toLowerCase()}" th:text="${u.role}">STUDENT</span></td>
              <td class="atd">
                <form th:action="@{/admin/users/{id}/approve(id=${u.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-primary">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Approve
                  </button>
                </form>
                <form th:action="@{/admin/users/{id}/reject(id=${u.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    Reject
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Teachers -->
    <div class="card mb-6">
      <div class="card-header">
        <h2 class="card-title">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
          Teachers
        </h2>
        <span class="badge b-count" th:text="${#lists.size(teachers)}">0</span>
      </div>
      <div class="tw">
        <table class="dt">
          <thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Subject</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="t : ${teachers}">
              <td th:text="${t.fullName}">Name</td>
              <td><code th:text="${t.username}">u</code></td>
              <td th:text="${t.email}">e</td>
              <td th:text="${t.subject ?: '—'}">Math</td>
              <td class="atd">
                <form th:action="@{/admin/users/{id}/delete(id=${t.id})}" method="post" onsubmit="return confirm('Delete this user?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Delete
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(teachers)}"><td colspan="5" class="erow">No teachers.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Students -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          Students
        </h2>
        <span class="badge b-count" th:text="${#lists.size(students)}">0</span>
      </div>
      <div class="tw">
        <table class="dt">
          <thead><tr><th>Name</th><th>Username</th><th>Student ID</th><th>Class</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="s : ${students}">
              <td th:text="${s.fullName}">Name</td>
              <td><code th:text="${s.username}">u</code></td>
              <td th:text="${s.studentId ?: '—'}">ID</td>
              <td th:text="${s.schoolClass != null ? s.schoolClass.name : '—'}">Class</td>
              <td><span th:class="${'badge b-' + s.approvalStatus.name().toLowerCase()}" th:text="${s.approvalStatus}">APPROVED</span></td>
              <td class="atd">
                <form th:action="@{/admin/users/{id}/delete(id=${s.id})}" method="post" onsubmit="return confirm('Delete?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Delete
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="erow">No students.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  // Mobile sidebar toggle
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
