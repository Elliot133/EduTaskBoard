<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Classes – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<!-- Hamburger button - 3 lines -->
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay - darkens screen when sidebar opens -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-admin}" th:with="activePage='classes'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Class Management</h1><p class="page-sub">Create and manage school classes</p></div>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>

    <div class="two-col">
      <div class="card">
        <div class="card-header"><h2 class="card-title">Add New Class</h2></div>
        <div class="fw">
          <form action="/admin/classes/save" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="fg"><label class="fl">Class Name *</label><input type="text" name="name" class="fi" placeholder="e.g. JSS 1A" required/></div>
            <div class="fg"><label class="fl">Description</label><input type="text" name="description" class="fi" placeholder="e.g. Junior Secondary 1"/></div>
            <div class="fg"><label class="fl">Academic Year</label><input type="number" name="academicYear" class="fi" value="2025"/></div>
            <div class="fg">
              <label class="fl">Class Teacher</label>
              <select name="teacherId" class="fi">
                <option value="">— None —</option>
                <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}">Teacher</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Class</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">All Classes</h2>
          <span class="badge b-count" th:text="${#lists.size(classes)}">0</span>
        </div>
        <div class="cls-list">
          <div th:each="c : ${classes}" class="cls-item">
            <div>
              <div class="cls-name" th:text="${c.name}">Class</div>
              <div class="cls-meta">
                <span th:text="${c.description ?: 'No description'}">Desc</span> ·
                Teacher: <span th:text="${c.classTeacher != null ? c.classTeacher.fullName : 'Unassigned'}">T</span>
              </div>
            </div>
            <form th:action="@{/admin/classes/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete class?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
          </div>
          <div th:if="${#lists.isEmpty(classes)}" class="empty-st">No classes yet.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // Mobile sidebar toggle
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
