<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Add User – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<!-- Hamburger button - 3 lines -->
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay - darkens screen when sidebar opens -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-admin}" th:with="activePage='users'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Add New User</h1><p class="page-sub">Create an account directly</p></div>
      <a th:href="@{/admin/users}" class="btn btn-outline">← Back</a>
    </div>

    <div th:if="${error}" class="alert a-error">⚠ <span th:text="${error}"></span></div>

    <div class="card">
      <div class="fw">
        <form action="/admin/users/save" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="fr">
            <div class="fg"><label class="fl">Full Name *</label><input type="text" name="fullName" class="fi" required/></div>
            <div class="fg"><label class="fl">Username *</label><input type="text" name="username" class="fi" required/></div>
          </div>
          <div class="fr">
            <div class="fg"><label class="fl">Email *</label><input type="email" name="email" class="fi" required/></div>
            <div class="fg"><label class="fl">Password *</label><input type="password" name="password" class="fi" required/></div>
          </div>
          <div class="fg">
            <label class="fl">Role *</label>
            <select name="role" class="fi" onchange="toggleFields(this.value)" required>
              <option value="STUDENT">Student</option>
              <option value="TEACHER">Teacher</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
          <div id="teacher-fields" style="display:none">
            <div class="fr">
              <div class="fg"><label class="fl">Subject</label><input type="text" name="subject" class="fi"/></div>
              <div class="fg"><label class="fl">Qualification</label><input type="text" name="qualification" class="fi"/></div>
            </div>
          </div>
          <div id="student-fields">
            <div class="fr">
              <div class="fg"><label class="fl">Student ID</label><input type="text" name="studentId" class="fi"/></div>
              <div class="fg">
                <label class="fl">Class</label>
                <select name="classId" class="fi">
                  <option value="">— None —</option>
                  <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}">Class</option>
                </select>
              </div>
            </div>
            <div class="fr">
              <div class="fg"><label class="fl">Parent Name</label><input type="text" name="parentName" class="fi"/></div>
              <div class="fg"><label class="fl">Parent Phone</label><input type="text" name="parentPhone" class="fi"/></div>
            </div>
          </div>
          <div class="faction">
            <a th:href="@{/admin/users}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Create User</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script>
function toggleFields(r){
  document.getElementById('teacher-fields').style.display = r==='TEACHER'?'block':'none';
  document.getElementById('student-fields').style.display = r==='STUDENT'?'block':'none';
}

// Mobile sidebar toggle
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const sidebar = document.querySelector('aside.sidebar');

if (sidebarToggle && sidebar && sidebarOverlay) {
  sidebarToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('show');
  });
  
  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('show');
  });

  sidebar.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 860) {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('show');
      }
    });
  });
}
</script>
</body>
</html>
