<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Messages – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta name="_me_id" th:content="${me.id}"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

  <style>
   .mc-contact { position: relative; }
   .mc-info { flex:1; min-width:0; }
   .mc-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
   .mc-sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
   .mc-contact.unread .mc-name { font-weight:700; color:var(--text); }
   .mc-badge { position:absolute; right:12px; top:50%; transform:translateY(-50%); }

   .mc-list { display: flex!important; flex-direction: column; overflow-y: hidden; }
   #contactsContainer { flex:1; overflow-y:auto; }

   .mc-search { padding:.7rem; border-bottom:1px solid var(--border); background:var(--white); flex-shrink:0; }
   .mc-search .fi { width:100%; }

   .page-header {
    display: flex !important;
    align-items: center;
    gap: 0.8rem;
   } 

   .page-header > div:last-child {
    display: flex;
    flex-direction: column;
   }

   #mobileBackBtn {
      display: inline-flex;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: .3rem;
      margin-right: .4rem;
      border-radius: 50%;
      transition: background .15s;
      color: var(--navy);
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
    }
   #mobileBackBtn:hover { background: var(--surface); }
   #mobileBackBtn .material-icons { font-size: 1.3rem; }

   /* Chat header - tight gap between back btn, avatar, text */
   .mc-top { 
      display: flex; 
      align-items: center; 
      gap: .4rem;
      padding: .7rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    /* Avatar smaller to reduce gap */
    .mc-avatar { 
      width: 34px; 
      height: 34px; 
      font-size: .8rem;
      margin-right: .2rem;
    }

    /* Name + status stack tight */
    .mc-top > div:last-child {
      display: flex;
      flex-direction: column;
      gap: 0;
      line-height: 1.2;
    }

    /* Chat layout - input pinned bottom */
    .mc-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .mc-body { 
      flex: 1; 
      overflow-y: auto; 
      padding: 1rem;
      min-height: 0;
    }
    .mc-inputrow {
      border-top: 1px solid var(--border);
      padding: .6rem;
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-shrink: 0;
      background: var(--white);
      position: sticky;
      bottom: 0;
    }

    @media (max-width: 860px) {
     .msg-center { grid-template-columns: 1fr; position: relative; height: calc(100vh - 140px); }
     .mc-list { width: 100%; height: 100%; }
     .mc-panel { 
        display: none; 
        width: 100%; 
        height: 100%; 
        flex-direction: column; 
        position: absolute; 
        top: 0; 
        left: 0; 
        background: var(--white); 
        z-index: 10;
      }
     .msg-center.chat-open .mc-list { display: none; }
     .msg-center.chat-open .mc-panel { display: flex; }
     
     /* Mobile: even tighter spacing */
     .mc-top { gap: .3rem; padding: .6rem .8rem; }
     #mobileBackBtn { margin-right: .2rem; padding: .2rem; }
     #mobileBackBtn .material-icons { font-size: 1.4rem; }
     .mc-avatar { width: 32px; height: 32px; }
    }

    @media (min-width: 861px) {
     .msg-center { grid-template-columns: 280px 1fr; }
     .mc-panel { display: flex!important; position: static; }
    }
  </style>
</head>
<body>
  <main class="main-content">
    <!-- NO back button here for contact list view -->
    <div class="page-header">
      <div>
        <button type="button" class="btn btn-online" onclick="history.back()">
           <span class="material-icons">arrow_back</span>
        </button>
        <h1 class="page-title">Messages</h1>
        <p class="page-sub">Chat with your school community — messages disappear after 2 hours</p>
      </div>
    </div>

    <div class="msg-center" id="msgCenter">
      <div class="mc-list" id="mcList">
        <div class="mc-search">
          <input id="searchBox" type="text" class="fi" placeholder="Search contacts…" oninput="ETBChat.filterContacts(this.value)"/>
        </div>
        <div id="contactsContainer"><div class="mc-section-title">Loading…</div></div>
      </div>

      <div class="mc-panel" id="mcPanel">
        <div class="mc-top">
          <!-- Back button sits beside avatar + text on both desktop + mobile -->
          <button id="mobileBackBtn" onclick="toggleMobileList(true)" aria-label="Back">
            <span class="material-icons">arrow_back</span>
          </button>
          <div class="mc-avatar" id="activeAvatar">?</div>
          <div>
            <div class="mc-name" id="activeName">Select a conversation</div>
            <div class="mc-sub" id="activeStatus"></div>
          </div>
        </div>
        <div class="mc-body" id="mcBody"><div class="empty-st">Pick a contact from the left to start chatting.</div></div>
        <div class="mc-inputrow">
          <input type="text" id="msgInput" class="fi" placeholder="Type a message…" style="flex:1" disabled onkeyup="handleTyping(event)"/>
          <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
      </div>
    </div>
  </main>

<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/messaging.js}"></script>
</body>
</html>
