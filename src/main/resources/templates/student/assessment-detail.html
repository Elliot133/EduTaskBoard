<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Assessment – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-student}" th:with="activePage='assessments'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${assessment.title}">Assessment</h1><p class="page-sub" th:text="${assessment.subject.name} + ' · ' + ${assessment.type}">Subject</p></div>
      <a th:href="@{/student/assessments}" class="btn btn-outline">← Back</a>
    </div>

    <div th:if="${error}" class="alert a-error">⚠ <span th:text="${error}"></span></div>

    <div class="card" style="padding:1.4rem">
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;font-size:.9rem;margin-bottom:1.2rem">
        <div><span class="muted" style="font-size:.72rem;display:block;font-weight:700;text-transform:uppercase">Opens</span><span th:text="${assessment.openDate} + ' ' + ${assessment.openTime}">Open</span></div>
        <div><span class="muted" style="font-size:.72rem;display:block;font-weight:700;text-transform:uppercase">Closes</span><span th:text="${assessment.closeDate} + ' ' + ${assessment.closeTime}">Close</span></div>
        <div><span class="muted" style="font-size:.72rem;display:block;font-weight:700;text-transform:uppercase">Duration</span><span th:text="${assessment.durationMinutes} + ' minutes'">60</span></div>
        <div><span class="muted" style="font-size:.72rem;display:block;font-weight:700;text-transform:uppercase">Status</span>
          <span th:if="${isOpen}" class="badge b-active">Open now</span>
          <span th:unless="${isOpen}" class="badge b-pending">Not open</span>
        </div>
      </div>

      <div th:if="${attempt == null}">
        <form th:action="@{/student/assessments/{id}/start(id=${assessment.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-primary" th:disabled="${!isOpen}">Start Assessment</button>
        </form>
        <p th:unless="${isOpen}" class="muted" style="margin-top:.6rem;font-size:.85rem">This assessment is outside its availability window.</p>
      </div>

      <div th:if="${attempt != null and attempt.status.name() == 'IN_PROGRESS'}">
        <a th:href="@{/student/assessments/attempts/{id}(id=${attempt.id})}" class="btn btn-primary">Continue Assessment</a>
      </div>

      <div th:if="${attempt != null and attempt.status.name() != 'IN_PROGRESS'}">
        <p class="muted" style="margin-bottom:.6rem">You have already submitted this assessment.</p>
        <a th:href="@{/student/assessments/attempts/{id}/result(id=${attempt.id})}" class="btn btn-outline">View Result</a>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>

</body>
</html>
