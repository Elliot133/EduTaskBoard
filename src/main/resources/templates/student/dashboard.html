<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Student Dashboard – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  
  <style>
    /* Student dashboard SVG sizing only - mobile handled globally now */
    .stats-grid .stat-card .si .nav-icon { width: 1.8rem; height: 1.8rem; fill: currentColor; margin-bottom: 0.4rem; }
    .tli-meta .nav-icon { width: 0.85rem; height: 0.85rem; fill: currentColor; margin-right: 0.25rem; vertical-align: middle; }
    .ann-head .nav-icon { width: 0.9rem; height: 0.9rem; fill: currentColor; margin-left: 0.3rem; vertical-align: middle; }
    .empty-st .nav-icon { width: 1.2rem; height: 1.2rem; fill: currentColor; margin-right: 0.4rem; vertical-align: middle; }
  </style>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-student}" th:with="activePage='dashboard'"></div>
  
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Hello, <span th:text="${student.fullName}">Student</span>!</h1>
        <p class="page-sub" th:text="${student.schoolClass != null ? student.schoolClass.name : 'No class assigned'}">Class</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card sc-blue">  
        <div class="si">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        </div>
        <div class="sv" th:text="${taskCount}">0</div>
        <div class="sl">Assignment Assigned</div>
      </div>
      
      <div class="stat-card sc-green"> 
        <div class="si">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <div class="sv" th:text="${submittedCount}">0</div>
        <div class="sl">Submitted</div>
      </div>
      
      <div class="stat-card sc-purple">
        <div class="si">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </div>
        <div class="sv" th:text="${gradedCount}">0</div>
        <div class="sl">Graded</div>
      </div>
      
      <div class="stat-card sc-amber">
        <div class="si">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <div class="sv" th:text="${avgScore != null ? #numbers.formatDecimal(avgScore,1,1) : '—'}">—</div>
        <div class="sl">Avg Score</div>
      </div>
    </div>

    <div class="two-col" style="margin-bottom:1.2rem">
      <div class="chart-card">
        <h3>Attendance Rate</h3>
        <div class="progress-label"><span>This term</span><span th:text="${attendancePercentage} + '%'"></span></div>
        <div class="progress-track"><div class="progress-fill" th:classappend="${attendancePercentage < 75 ? 'danger' : (attendancePercentage < 90 ? 'warn' : '')}" th:style="'width:' + ${attendancePercentage} + '%'"></div></div>
      </div>
      <div class="chart-card">
        <h3>Assignments Overview</h3>
        <div class="chart-box" style="height:200px"><canvas id="taskChart"></canvas></div>
      </div>
    </div>

    <div class="content-grid">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">My Assignment</h2>
          <a th:href="@{/student/tasks}" class="btn btn-outline btn-sm">View All</a>
        </div>
        <div>
          <div th:each="t, tStat : ${myTasks}" th:if="${tStat.index < 5}" class="tli">
            <div class="tli-head">
              <span class="tli-title" th:text="${t.title}">Title</span>
              <span th:class="${'badge b-' + t.priority.name().toLowerCase()}" th:text="${t.priority}">HIGH</span>
            </div>
            <div class="tli-meta">
              <span>
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                Due: <strong th:text="${t.dueDate}">date</strong>
              </span>
              <span>
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
                <span th:text="${t.subject ?: '—'}">subj</span>
              </span>
              <a th:href="@{/student/tasks/{id}(id=${t.id})}" style="color:var(--emerald);font-weight:600">
                Open
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </a>
            </div>
          </div>
          <div th:if="${#lists.isEmpty(myTasks)}" class="empty-st">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            No assignment assigned yet!
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Announcements</h2>
          <a th:href="@{/student/announcements}" class="btn btn-outline btn-sm">All</a>
        </div>
        <div class="ann-list">
          <div th:each="a, aStat : ${announcements}" th:if="${aStat.index < 5}" class="ann-item">
            <div class="ann-head">
              <span class="ann-title" th:text="${a.title}">Title</span>
              <span th:if="${a.pinned}">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 9h4.5l-4-4V9zM9 2v2H7v2h2v12c0 1.1.9 2 2 2h8v-2h-8V6h5l4-4H9z"/></svg>
              </span>
            </div>
            <p class="ann-body" th:text="${#strings.abbreviate(a.content,110)}">Content</p>
          </div>
          <div th:if="${#lists.isEmpty(announcements)}" class="empty-st">No announcements.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script th:inline="javascript">
  // Chart only - mobile toggle now global
  new Chart(document.getElementById('taskChart'), {
    type: 'doughnut',
    data: {
      labels: ['Submitted', 'Graded', 'Pending'],
      datasets: [{
        data: [
          /*[[${submittedCount}]]*/ 0,
          /*[[${gradedCount}]]*/ 0,
          Math.max(0, (/*[[${taskCount}]]*/ 0) - (/*[[${submittedCount}]]*/ 0))
        ],
        backgroundColor: ['#0ea5e9', '#10b981', '#f59e0b']
      }]
    },
    options: { plugins: { legend: { position: 'bottom' } }, maintainAspectRatio: false }
  });
</script>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>

</body>
</html>
