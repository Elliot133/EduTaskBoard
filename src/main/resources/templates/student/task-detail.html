<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Task Detail – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <style>
    /* Task detail SVG sizing */
    .dmr .muted .nav-icon {
      width: 0.9rem;
      height: 0.9rem;
      fill: currentColor;
      margin-right: 0.3rem;
      vertical-align: middle;
    }
    .pending-g .nav-icon {
      width: 1rem;
      height: 1rem;
      fill: currentColor;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .btn-outline .nav-icon {
      width: 0.9rem;
      height: 0.9rem;
      fill: currentColor;
      margin-right: 0.3rem;
      vertical-align: middle;
    }
  </style>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-student}" th:with="activePage='tasks'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${task != null ? task.title : 'Task'}">Assignment</h1><p class="page-sub">Assignment Details</p></div>
      <a th:href="@{/student/tasks}" class="btn btn-outline">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back
      </a>
    </div>

    <div th:if="${task != null}">
      <!-- Task info -->
      <div class="card mb-6">
        <div class="tdw">
          <div class="dmr">
            <span th:class="${'badge b-' + task.priority.name().toLowerCase()}" th:text="${task.priority}">HIGH</span>
            <span th:class="${'badge b-' + task.status.name().toLowerCase()}"   th:text="${task.status}">ACTIVE</span>
            
            <span class="muted">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
              <span th:text="${task.subject ?: '—'}">Subj</span>
            </span>
            
            <span class="muted">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
              Due: <strong th:text="${task.dueDate}">Date</strong>
            </span>
            
            <span class="muted">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.36 1.05 1.25 1.88 2.35 2.16v1.4H7v2h10v-2h-2.75v-1.4c1.1-.28 1.99-1.11 2.35-2.16C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82c-1.16-.41-2-.96-2-1.82zM19 8c0 .86-.84 1.41-2 1.82V7h2v1z"/></svg>
              Max score: <strong th:text="${task.maxScore ?: '?'}">100</strong>
            </span>
            
            <span class="muted">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              <span th:text="${task.teacher != null ? task.teacher.fullName : '—'}">Teacher</span>
            </span>
          </div>
          <div class="task-desc" th:text="${task.description ?: 'No description provided.'}">Desc</div>
        </div>
      </div>

      <!-- Already submitted -->
      <div th:if="${submitted}" class="card">
        <div class="card-header">
          <h2 class="card-title">Your Submission</h2>
          <span th:class="${'badge b-' + submission.status.name().toLowerCase()}" th:text="${submission.status}">SUBMITTED</span>
        </div>
        <div class="tdw">
          <span class="mlbl">Your Answer</span>
          <div class="sub-box" th:text="${submission.content}">Content</div>

          <div th:if="${submission.score != null}" style="margin-top:1.4rem">
            <span class="mlbl">Your Grade</span>
            <div class="grade-row">
              <span class="score-big" th:text="${submission.score}">90</span>
              <span class="score-den">/ <span th:text="${task.maxScore ?: '?'}">100</span></span>
            </div>
            <div th:if="${submission.teacherFeedback != null}" class="fb-box">
              <span class="mlbl">Teacher Feedback</span>
              <p th:text="${submission.teacherFeedback}">Feedback</p>
            </div>
          </div>
          <p th:if="${submission.score == null}" class="pending-g">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Awaiting teacher review…
          </p>
        </div>
      </div>

      <!-- Submit form -->
      <div th:if="${!submitted}" class="card">
        <div class="card-header"><h2 class="card-title">Submit Your Work</h2></div>
        <div class="fw">
          <form th:action="@{/student/tasks/{id}/submit(id=${task.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="fg">
              <label class="fl">Your Answer / Work *</label>
              <textarea name="content" class="fi ftal" placeholder="Type your answer, solution, or write-up here…" required></textarea>
            </div>
            <div class="faction">
              <a th:href="@{/student/tasks}" class="btn btn-outline">Cancel</a>
              <button type="submit" class="btn btn-primary">Submit Assignment</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>

</body>
</html>
