<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Attendance – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='attendance'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Mark Attendance</h1><p class="page-sub">Attendance feeds directly into report cards</p></div>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert a-error">⚠ <span th:text="${error}"></span></div>

    <div class="card" style="padding:1rem 1.4rem;margin-bottom:1.2rem">
      <form method="get" action="/teacher/attendance" style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap">
        <div class="fg" style="margin:0">
          <label class="fl">Class</label>
          <select name="classId" class="fi" onchange="this.form.submit()">
            <option th:each="c : ${myClasses}" th:value="${c.id}" th:text="${c.name}"
                    th:selected="${selectedClass != null and selectedClass.id == c.id}">Class</option>
          </select>
        </div>
        <div class="fg" style="margin:0">
          <label class="fl">Date</label>
          <input type="date" name="date" class="fi" th:value="${date}" onchange="this.form.submit()"/>
        </div>
      </form>
    </div>

    <div class="card" th:if="${selectedClass != null}">
      <form action="/teacher/attendance/save" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="classId" th:value="${selectedClass.id}"/>
        <input type="hidden" name="date" th:value="${date}"/>
        <div class="tw">
          <table class="dt">
            <thead><tr><th>Student</th><th>Status</th></tr></thead>
            <tbody>
              <tr th:each="s : ${students}">
                <td th:text="${s.fullName}">Student</td>
                <td>
                  <input type="hidden" name="studentIds" th:value="${s.id}"/>
                  <select name="statuses" class="fi" style="max-width:160px">
                    <option value="PRESENT" th:selected="${existing.get(s.id) == null or existing.get(s.id).status.name() == 'PRESENT'}">Present</option>
                    <option value="ABSENT" th:selected="${existing.get(s.id) != null and existing.get(s.id).status.name() == 'ABSENT'}">Absent</option>
                    <option value="LATE" th:selected="${existing.get(s.id) != null and existing.get(s.id).status.name() == 'LATE'}">Late</option>
                    <option value="EXCUSED" th:selected="${existing.get(s.id) != null and existing.get(s.id).status.name() == 'EXCUSED'}">Excused</option>
                  </select>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(students)}"><td colspan="2" class="erow">No students in this class.</td></tr>
            </tbody>
          </table>
        </div>
        <div class="faction" style="padding:1rem 1.4rem">
          <button type="submit" class="btn btn-primary">Save Attendance</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
