<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Assessment Form – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='assessments'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${assessment != null and assessment.id != null ? 'Edit Assessment' : 'New Assessment'}">Assessment</h1>
        <p class="page-sub">CA1 = 15 objective (20 marks) · CA2 = 6 theory (20 marks) · Exam = 15 objective + 5 theory (60 marks)</p></div>
      <a th:href="@{/teacher/assessments}" class="btn btn-outline">← Back</a>
    </div>

    <div class="card">
      <div class="fw">
        <form action="/teacher/assessments/save" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="assessmentId" th:value="${assessment != null ? assessment.id : ''}"/>

          <div class="fr">
            <div class="fg" style="flex:2">
              <label class="fl">Title *</label>
              <input type="text" name="title" class="fi" th:value="${assessment != null ? assessment.title : ''}" placeholder="e.g. Mathematics CA1" required/>
            </div>
            <div class="fg">
              <label class="fl">Type *</label>
              <select name="type" class="fi" required>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"
                        th:selected="${assessment != null and assessment.type == t}">Type</option>
              </select>
            </div>
          </div>

          <div class="fr">
            <div class="fg">
              <label class="fl">Subject *</label>
              <select name="subjectId" class="fi" required>
                <option value="">— Select —</option>
                <option th:each="a : ${myAssignments}" th:value="${a.subject.id}" th:text="${a.subject.name}"
                        th:selected="${assessment != null and assessment.subject != null and assessment.subject.id == a.subject.id}">Subject</option>
              </select>
            </div>
            <div class="fg">
              <label class="fl">Class *</label>
              <select name="classId" class="fi" required>
                <option value="">— Select —</option>
                <option th:each="a : ${myAssignments}" th:value="${a.schoolClass.id}" th:text="${a.schoolClass.name}"
                        th:selected="${assessment != null and assessment.schoolClass != null and assessment.schoolClass.id == a.schoolClass.id}">Class</option>
              </select>
            </div>
          </div>

          <h3 style="margin:1.25rem 0 .5rem;font-size:.95rem">Availability (Module 5)</h3>
          <div class="fr">
            <div class="fg"><label class="fl">Opening Date</label><input type="date" name="openDate" class="fi" th:value="${assessment != null ? assessment.openDate : ''}"/></div>
            <div class="fg"><label class="fl">Opening Time</label><input type="time" name="openTime" class="fi" th:value="${assessment != null ? assessment.openTime : ''}"/></div>
          </div>
          <div class="fr">
            <div class="fg"><label class="fl">Closing Date</label><input type="date" name="closeDate" class="fi" th:value="${assessment != null ? assessment.closeDate : ''}"/></div>
            <div class="fg"><label class="fl">Closing Time</label><input type="time" name="closeTime" class="fi" th:value="${assessment != null ? assessment.closeTime : ''}"/></div>
          </div>
          <p class="muted" style="font-size:.8rem">Leave blank to default to now → +3 hours.</p>

          <div class="fg">
            <label class="fl">Assessment Duration (minutes) *</label>
            <select name="durationMinutes" class="fi" required>
              <option value="20"  th:selected="${assessment != null and assessment.durationMinutes == 20}">20 Minutes</option>
              <option value="30"  th:selected="${assessment != null and assessment.durationMinutes == 30}">30 Minutes</option>
              <option value="45"  th:selected="${assessment != null and assessment.durationMinutes == 45}">45 Minutes</option>
              <option value="60"  th:selected="${assessment == null or assessment.durationMinutes == 60}">1 Hour</option>
              <option value="120" th:selected="${assessment != null and assessment.durationMinutes == 120}">2 Hours</option>
            </select>
          </div>

          <div class="faction">
            <a th:href="@{/teacher/assessments}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save & Add Questions →</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
