<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mark Submission – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='assessments'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${attempt.student.fullName}">Student</h1>
        <p class="page-sub" th:text="${attempt.assessment.title}">Assessment</p></div>
      <a th:href="@{/teacher/assessments/{id}/submissions(id=${attempt.assessment.id})}" class="btn btn-outline">← Back</a>
    </div>

    <form th:action="@{/teacher/assessments/attempts/{id}/mark(id=${attempt.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div th:each="ans,st : ${answers}" class="card mb-6" style="padding:1.2rem 1.4rem">
        <div class="cls-meta" style="margin-bottom:.4rem">
          Q<span th:text="${st.count}"></span> ·
          <span th:text="${ans.question.type}">TYPE</span> ·
          Max <span th:text="${ans.question.marks}">0</span> marks
        </div>
        <div style="font-weight:600;margin-bottom:.6rem" th:text="${ans.question.questionText}">Question text</div>

        <div th:if="${ans.question.type.name() == 'OBJECTIVE'}">
          <p class="muted">Student selected: <strong th:text="${ans.selectedOption ?: 'No answer'}">A</strong> ·
             Correct: <strong th:text="${ans.question.correctOption}">A</strong> ·
             Auto-marked: <strong th:text="${ans.marksAwarded} + '/' + ${ans.question.marks}">0/2</strong></p>
          <input type="hidden" name="answerIds" th:value="${ans.id}"/>
          <input type="hidden" name="marks" th:value="${ans.marksAwarded ?: 0}"/>
        </div>

        <div th:if="${ans.question.type.name() == 'THEORY'}">
          <div class="fg">
            <label class="fl">Student's Answer</label>
            <div style="background:var(--bg-2,#f6f7f9);padding:.75rem;border-radius:.5rem;white-space:pre-wrap" th:text="${ans.answerText ?: 'No answer submitted'}">Answer</div>
          </div>
          <div class="fg" style="max-width:200px">
            <label class="fl">Marks Awarded (max <span th:text="${ans.question.marks}">0</span>)</label>
            <input type="number" name="marks" class="fi" th:value="${ans.marksAwarded ?: 0}" min="0" th:max="${ans.question.marks}" required/>
          </div>
          <input type="hidden" name="answerIds" th:value="${ans.id}"/>
        </div>
      </div>

      <div class="faction">
        <button type="submit" class="btn btn-primary">Save Marks</button>
      </div>
    </form>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
