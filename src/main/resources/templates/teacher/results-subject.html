<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Subject Results – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='results'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${schoolClass.name} + ' — Subject Results'">Results</h1>
        <p class="page-sub">Totals, highest, average, grade and position are computed automatically</p></div>
      <a th:href="@{/teacher/results}" class="btn btn-outline">← Back</a>
    </div>

    <div class="card" th:if="${#lists.isEmpty(results)}">
      <div class="empty-st">Results appear here once CA1, CA2 and Exam are fully marked for every student in this class.</div>
    </div>

    <div th:each="r : ${results}" class="card mb-6" style="padding:1.2rem 1.4rem">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem">
        <div>
          <div style="font-weight:700" th:text="${r.student.fullName}">Student</div>
          <div class="muted" style="font-size:.8rem">
            CA1: <b th:text="${r.ca1}">0</b> · CA2: <b th:text="${r.ca2}">0</b> · Exam: <b th:text="${r.exam}">0</b> ·
            Total: <b th:text="${r.total}">0</b> · Highest: <b th:text="${r.highest}">0</b> · Average: <b th:text="${r.average}">0</b>
          </div>
        </div>
        <div style="text-align:right">
          <div th:class="'grade-' + ${r.grade}" style="font-size:1.4rem" th:text="${r.grade}">A</div>
          <div class="muted" style="font-size:.75rem">Position #<span th:text="${r.subjectPosition}">1</span></div>
        </div>
      </div>
      <form action="/teacher/results/subject/remark" method="post" style="margin-top:.8rem;display:flex;gap:.5rem">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="subjectResultId" th:value="${r.id}"/>
        <input type="text" name="remark" class="fi" th:value="${r.teacherRemark}" placeholder="Write a remark…" style="flex:1"/>
        <button type="submit" class="btn btn-sm btn-primary">Save</button>
      </form>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
