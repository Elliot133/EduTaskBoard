<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Questions – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='assessments'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${assessment.title}">Assessment</h1>
        <p class="page-sub" th:text="'Required: ' + ${assessment.requiredObjectiveCount} + ' objective, ' + ${assessment.requiredTheoryCount} + ' theory — total ' + ${assessment.requiredTotalMarks} + ' marks'">Rules</p></div>
      <a th:href="@{/teacher/assessments}" class="btn btn-outline">← Back</a>
    </div>

    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert a-error">⚠ <span th:text="${error}"></span></div>

    <div class="card mb-6" style="padding:1.2rem 1.4rem">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
        <div>
          <span class="muted" style="font-size:.8rem">Total marks so far: </span>
          <strong th:text="${totalMarks} + ' / ' + ${assessment.requiredTotalMarks}">0/20</strong>
        </div>
        <div th:if="${validationError == null}" class="badge b-active">Ready to publish</div>
        <div th:if="${validationError != null}" class="badge b-pending" th:text="${validationError}">Not ready</div>
        <div style="display:flex;gap:.5rem">
          <form th:if="${!assessment.published}" th:action="@{/teacher/assessments/{id}/publish(id=${assessment.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-primary" th:disabled="${validationError != null}">Publish</button>
          </form>
          <form th:if="${assessment.published}" th:action="@{/teacher/assessments/{id}/unpublish(id=${assessment.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline">Unpublish</button>
          </form>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-header"><h2 class="card-title">Add Question</h2></div>
        <div class="fw">
          <form th:action="@{/teacher/assessments/{id}/questions/save(id=${assessment.id})}" method="post" id="qform">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="fg">
              <label class="fl">Question Type *</label>
              <select name="type" class="fi" id="qtype" onchange="toggleOptions()" required>
                <option value="OBJECTIVE">Objective</option>
                <option value="THEORY">Theory</option>
              </select>
            </div>
            <div class="fg">
              <label class="fl">Question Text *</label>
              <textarea name="questionText" class="fi ftal" required></textarea>
            </div>
            <div id="optionsBlock">
              <div class="fg"><label class="fl">Option A</label><input type="text" name="optionA" class="fi"/></div>
              <div class="fg"><label class="fl">Option B</label><input type="text" name="optionB" class="fi"/></div>
              <div class="fg"><label class="fl">Option C</label><input type="text" name="optionC" class="fi"/></div>
              <div class="fg"><label class="fl">Option D</label><input type="text" name="optionD" class="fi"/></div>
              <div class="fg">
                <label class="fl">Correct Option</label>
                <select name="correctOption" class="fi">
                  <option value="">— None —</option>
                  <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                </select>
              </div>
            </div>
            <div class="fg"><label class="fl">Marks *</label><input type="number" name="marks" class="fi" min="1" required/></div>
            <button type="submit" class="btn btn-primary btn-full">Add Question</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Questions</h2>
          <span class="badge b-count" th:text="${#lists.size(questions)}">0</span>
        </div>
        <div class="cls-list">
          <div th:each="q,st : ${questions}" class="cls-item" style="align-items:flex-start">
            <div>
              <div class="cls-name" th:text="'Q' + ${st.count} + '. ' + ${q.questionText}">Question</div>
              <div class="cls-meta">
                <span th:text="${q.type}">TYPE</span> ·
                <span th:text="${q.marks} + ' marks'">marks</span>
                <span th:if="${q.type.name() == 'OBJECTIVE'}" th:text="' · Correct: ' + (${q.correctOption} ?: '—')"></span>
              </div>
            </div>
            <form th:action="@{/teacher/assessments/questions/{qid}/delete(qid=${q.id})}" method="post" onsubmit="return confirm('Delete question?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <input type="hidden" name="assessmentId" th:value="${assessment.id}"/>
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
          </div>
          <div th:if="${#lists.isEmpty(questions)}" class="empty-st">No questions added yet.</div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
function toggleOptions() {
  var type = document.getElementById('qtype').value;
  document.getElementById('optionsBlock').style.display = (type === 'OBJECTIVE') ? 'block' : 'none';
}
toggleOptions();
</script>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
