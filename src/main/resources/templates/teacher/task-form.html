<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Task Form – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='tasks'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title" th:text="${task != null and task.id != null ? 'Edit Task' : 'New Task'}">Assignment</h1><p class="page-sub">Assign work to your class</p></div>
      <a th:href="@{/teacher/tasks}" class="btn btn-outline">← Back</a>
    </div>

    <div class="card">
      <div class="fw">
        <form action="/teacher/tasks/save" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="taskId" th:value="${task != null ? task.id : ''}"/>

          <div class="fr">
            <div class="fg" style="flex:2">
              <label class="fl">Assignment Title *</label>
              <input type="text" name="title" class="fi" th:value="${task != null ? task.title : ''}" placeholder="e.g. Chapter 5 Exercises" required/>
            </div>
            <div class="fg">
              <label class="fl">Subject</label>
              <input type="text" name="subject" class="fi" th:value="${task != null ? task.subject : ''}" placeholder="e.g. Mathematics"/>
            </div>
          </div>

          <div class="fg">
            <label class="fl">Instructions / Description</label>
            <textarea name="description" class="fi ftal" th:text="${task != null ? task.description : ''}" placeholder="Describe the task in detail…"></textarea>
          </div>

          <div class="fr">
            <div class="fg">
              <label class="fl">Assign to Class *</label>
              <select name="classId" class="fi" required>
                <option value="">— Select Class —</option>
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${task != null and task.schoolClass != null and task.schoolClass.id == c.id}">Class</option>
              </select>
            </div>
            <div class="fg">
              <label class="fl">Due Date *</label>
              <input type="date" name="dueDate" class="fi" th:value="${task != null ? task.dueDate : ''}" required/>
            </div>
          </div>

          <div class="fr">
            <div class="fg">
              <label class="fl">Priority</label>
              <select name="priority" class="fi">
                <option value="LOW"    th:selected="${task != null and task.priority.name() == 'LOW'}">Low</option>
                <option value="MEDIUM" th:selected="${task == null or task.priority.name() == 'MEDIUM'}">Medium</option>
                <option value="HIGH"   th:selected="${task != null and task.priority.name() == 'HIGH'}">High</option>
              </select>
            </div>
            <div class="fg">
              <label class="fl">Max Score</label>
              <input type="number" name="maxScore" class="fi" th:value="${task != null ? task.maxScore : ''}" placeholder="100"/>
            </div>
            <div class="fg">
              <label class="fl">Status</label>
              <select name="status" class="fi">
                <option value="ACTIVE" th:selected="${task == null or task.status.name() == 'ACTIVE'}">Active</option>
                <option value="DRAFT"  th:selected="${task != null and task.status.name() == 'DRAFT'}">Draft</option>
                <option value="CLOSED" th:selected="${task != null and task.status.name() == 'CLOSED'}">Closed</option>
              </select>
            </div>
          </div>

          <div class="faction">
            <a th:href="@{/teacher/tasks}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Assignment</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
