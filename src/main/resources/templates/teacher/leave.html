<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Leave Requests – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='timetable'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Leave Requests</h1><p class="page-sub">Submit and track your leave applications</p></div>
      <a th:href="@{/teacher/timetable}" class="btn btn-outline">← Timetable</a>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>

    <div class="two-col">
      <div class="card">
        <div class="card-header"><h2 class="card-title">Request Leave</h2></div>
        <div class="fw">
          <form action="/teacher/leave/request" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="fr">
              <div class="fg"><label class="fl">Start Date *</label><input type="date" name="startDate" class="fi" required/></div>
              <div class="fg"><label class="fl">End Date *</label><input type="date" name="endDate" class="fi" required/></div>
            </div>
            <div class="fg"><label class="fl">Reason *</label><textarea name="reason" class="fi ftal" required></textarea></div>
            <button type="submit" class="btn btn-primary btn-full">Submit Request</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h2 class="card-title">My Leave History</h2></div>
        <div class="cls-list">
          <div th:each="r : ${requests}" class="cls-item">
            <div>
              <div class="cls-name" th:text="${r.startDate} + ' → ' + ${r.endDate}">Dates</div>
              <div class="cls-meta" th:text="${r.reason}">Reason</div>
            </div>
            <span th:if="${r.status.name() == 'PENDING'}" class="badge b-pending">Pending</span>
            <span th:if="${r.status.name() == 'APPROVED'}" class="badge b-active">Approved</span>
            <span th:if="${r.status.name() == 'REJECTED'}" class="badge b-late">Rejected</span>
          </div>
          <div th:if="${#lists.isEmpty(requests)}" class="empty-st">No leave requests yet.</div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
