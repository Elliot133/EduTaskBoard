<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Results – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='results'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Results</h1><p class="page-sub">Totals, grades, and positions are calculated automatically — just add your remarks</p></div>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>

    <div class="card mb-6">
      <div class="card-header"><h2 class="card-title">Subjects You Teach</h2></div>
      <div class="cls-list">
        <div th:each="a : ${myAssignments}" class="cls-item">
          <div>
            <div class="cls-name" th:text="${a.subject.name} + ' — ' + ${a.schoolClass.name}">Subject</div>
          </div>
          <a th:href="@{/teacher/results/subject(subjectId=${a.subject.id},classId=${a.schoolClass.id})}" class="btn btn-sm btn-outline">View Results</a>
        </div>
        <div th:if="${#lists.isEmpty(myAssignments)}" class="empty-st">No subject assignments yet.</div>
      </div>
    </div>

    <div class="card" th:if="${!#lists.isEmpty(classTeacherOf)}">
      <div class="card-header"><h2 class="card-title">Classes You're Class Teacher Of</h2></div>
      <div class="cls-list">
        <div th:each="c : ${classTeacherOf}" class="cls-item">
          <div class="cls-name" th:text="${c.name}">Class</div>
          <a th:href="@{/teacher/results/class(classId=${c.id})}" class="btn btn-sm btn-primary">Report Cards</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
