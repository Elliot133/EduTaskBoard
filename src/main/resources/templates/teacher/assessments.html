<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Assessments – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='assessments'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Assessments (CBT)</h1><p class="page-sub">CA1, CA2 and Exam for your subjects/classes</p></div>
      <a th:href="@{/teacher/assessments/new}" class="btn btn-primary">+ New Assessment</a>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert a-error">⚠ <span th:text="${error}"></span></div>

    <div class="card">
      <div class="tw">
        <table class="dt">
          <thead><tr><th>Title</th><th>Type</th><th>Subject</th><th>Class</th><th>Status</th><th>Window</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="a : ${assessments}">
              <td th:text="${a.title}">Title</td>
              <td th:text="${a.type}">CA1</td>
              <td th:text="${a.subject.name}">Subject</td>
              <td th:text="${a.schoolClass.name}">Class</td>
              <td>
                <span th:if="${a.published}" class="badge b-active">Published</span>
                <span th:unless="${a.published}" class="badge b-pending">Draft</span>
                <span th:if="${a.approved}" class="badge b-submitted">Approved</span>
              </td>
              <td th:text="${a.openDate} + ' ' + ${a.openTime} + ' → ' + ${a.closeDate} + ' ' + ${a.closeTime}">Window</td>
              <td style="display:flex;gap:.4rem;flex-wrap:wrap">
                <a th:href="@{/teacher/assessments/{id}/questions(id=${a.id})}" class="btn btn-sm btn-outline">Questions</a>
                <a th:href="@{/teacher/assessments/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline">Edit</a>
                <a th:href="@{/teacher/assessments/{id}/submissions(id=${a.id})}" class="btn btn-sm btn-outline">Submissions</a>
                <form th:if="${a.published and !a.approved}" th:action="@{/teacher/assessments/{id}/approve(id=${a.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-primary">Approve</button>
                </form>
                <form th:action="@{/teacher/assessments/{id}/delete(id=${a.id})}" method="post" onsubmit="return confirm('Delete this assessment?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(assessments)}"><td colspan="7" class="erow">No assessments created yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
