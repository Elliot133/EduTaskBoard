<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Grade Submission – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='tasks'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">Grade Submission</h1><p class="page-sub">Review and score student work</p></div>
      <a th:href="@{/teacher/tasks}" class="btn btn-outline">← Back</a>
    </div>

    <div th:if="${submission != null}">
      <!-- Student answer -->
      <div class="card mb-6">
        <div class="card-header">
          <h2 class="card-title">Student: <span th:text="${submission.student.fullName}">Name</span></h2>
          <span class="badge b-submitted" th:text="${submission.task.title}">Task</span>
        </div>
        <div class="tdw">
          <span class="mlbl">Submitted Answer</span>
          <div class="sub-box" th:text="${submission.content}">Content</div>
          <p style="margin-top:.9rem;font-size:.8rem;color:var(--muted)">
            Submitted: <span th:text="${submission.submittedAt}">Date</span>
          </p>
        </div>
      </div>

      <!-- Grade form -->
      <div class="card">
        <div class="card-header"><h2 class="card-title">Add Grade &amp; Feedback</h2></div>
        <div class="fw">
          <form th:action="@{/teacher/submissions/{id}/grade(id=${submission.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="fg">
              <label class="fl">Score (out of <span th:text="${submission.task.maxScore ?: '?'}">100</span>)</label>
              <input type="number" name="score" class="fi" th:value="${submission.score}"
                     th:max="${submission.task.maxScore}" min="0" style="max-width:180px" required/>
            </div>
            <div class="fg">
              <label class="fl">Feedback to Student</label>
              <textarea name="teacherFeedback" class="fi ftal" th:text="${submission.teacherFeedback}"
                        placeholder="Write constructive feedback for the student…"></textarea>
            </div>
            <div class="faction">
              <a th:href="@{/teacher/tasks}" class="btn btn-outline">Cancel</a>
              <button type="submit" class="btn btn-primary">Submit Grade</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
