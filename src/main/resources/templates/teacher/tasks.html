<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Tasks – EduTaskBoard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="app-body">
<button id="sidebarToggle" class="hamburger-btn" aria-label="Open menu">
  <span></span>
  <span></span>
  <span></span>
</button>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="layout">
  <div th:replace="~{shared/layout-fragments :: sidebar-teacher}" th:with="activePage='tasks'"></div>
  <main class="main-content">
    <div class="page-header">
      <div><h1 class="page-title">My Assignment</h1><p class="page-sub">All assignment you have created</p></div>
      <a th:href="@{/teacher/tasks/new}" class="btn btn-primary">+ New Assignment</a>
    </div>
    <div th:if="${success}" class="alert a-success">✓ <span th:text="${success}"></span></div>

    <div class="card">
      <div class="tw">
        <table class="dt">
          <thead><tr><th>Title</th><th>Class</th><th>Subject</th><th>Due Date</th><th>Priority</th><th>Max Score</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="t : ${tasks}">
              <td th:text="${t.title}">Title</td>
              <td th:text="${t.schoolClass != null ? t.schoolClass.name : '—'}">Class</td>
              <td th:text="${t.subject ?: '—'}">Subj</td>
              <td th:text="${t.dueDate}">Date</td>
              <td><span th:class="${'badge b-' + t.priority.name().toLowerCase()}" th:text="${t.priority}">MED</span></td>
              <td th:text="${t.maxScore ?: '—'}">100</td>
              <td class="atd">
                <a th:href="@{/teacher/tasks/{id}/submissions(id=${t.id})}" class="btn btn-sm btn-primary">Submissions</a>
                <a th:href="@{/teacher/tasks/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline">Edit</a>
                <form th:action="@{/teacher/tasks/{id}/delete(id=${t.id})}" method="post" onsubmit="return confirm('Delete?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}"><td colspan="7" class="erow">No assignment. <a th:href="@{/teacher/tasks/new}" style="color:var(--emerald)">Create one →</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebar = document.querySelector('aside.sidebar');

  if (sidebarToggle && sidebar && sidebarOverlay) {
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    });
    
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');
    });

    sidebar.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 860) {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
        }
      });
    });
  }
</script>
</body>
</html>
